async function loadQuiz() {
  startCamera(); // camera check
  try {
    const token = localStorage.getItem("token");
    const res = await fetch("/api/quiz/questions", {
      headers: { Authorization: `Bearer ${token}` },
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`Fetch failed: ${res.status} ${errText}`);
    }

    const data = await res.json();
    questions = data.questions || data;

    if (!questions.length) {
      document.getElementById("quizContainer").innerHTML =
        "<p>No questions available</p>";
      return;
    }

    // 🔥 integrate
    createQuestionButtons();
    showQuestion(0);

  } catch (err) {
    console.error("🔥 Error loading quiz:", err);
  }
}

// create buttons
function createQuestionButtons() {
  const container = document.getElementById("questionButtons");
  container.innerHTML = "";
  questions.forEach((q, index) => {
    const btn = document.createElement("button");
    btn.textContent = index + 1;
    btn.classList.add("q-btn");
    btn.onclick = () => showQuestion(index);
    container.appendChild(btn);
  });
}

// show question logic
function showQuestion(index = currentQuestionIndex) {
  currentQuestionIndex = index;
  const questionEl = document.getElementById("question");
  const optionsEl = document.getElementById("options");
  const questionInfoEl = document.getElementById("questionInfo");

  const q = questions[currentQuestionIndex];
  questionInfoEl.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
  questionEl.textContent = q.question;

  optionsEl.innerHTML = "";

  if (q.options && q.options.length > 0) {
    q.options.forEach(option => {
      const safeOption = option.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const checked = answers[`q${currentQuestionIndex}`] === option ? "checked" : "";
      optionsEl.innerHTML += `
        <label>
          <input type="radio" name="option" value="${option}" ${checked}
          onchange="selectOption('${option}')"> ${safeOption}
        </label><br>
      `;
    });
  } else {
    const saved = answers[`q${currentQuestionIndex}`] || "";
    optionsEl.innerHTML = `
      <textarea id="typedAnswer" rows="5" style="width:100%; padding:10px; font-size:16px;"
      placeholder="Type your answer here..." oninput="selectOption(this.value)">${saved}</textarea>
    `;
  }

  highlightCurrentButton();
  document.getElementById("prevBtn").style.display = currentQuestionIndex === 0 ? "none" : "inline-block";
  document.getElementById("nextBtn").style.display = currentQuestionIndex === questions.length - 1 ? "none" : "inline-block";
  document.getElementById("submitBtn").style.display = currentQuestionIndex === questions.length - 1 ? "inline-block" : "none";
}

function selectOption(option) {
  answers[`q${currentQuestionIndex}`] = option;
}

// highlight
function highlightCurrentButton() {
  const btns = document.querySelectorAll(".q-btn");
  btns.forEach((btn, i) => {
    if (i === currentQuestionIndex) {
      btn.style.backgroundColor = "#c37e34";
      btn.style.color = "#fff";
    } else if (answers[`q${i}`]) {
      btn.style.backgroundColor = "#4CAF50";
      btn.style.color = "#fff";
    } else {
      btn.style.backgroundColor = "#fff";
      btn.style.color = "#000";
    }
  });
}

function nextQuestion() {
  if (currentQuestionIndex < questions.length - 1) {
    currentQuestionIndex++;
    showQuestion();
  }
}
function prevQuestion() {
  if (currentQuestionIndex > 0) {
    currentQuestionIndex--;
    showQuestion();
  }
}

function submitQuiz() {
  console.log("Submitted answers:", answers);
  // here you can send answers to backend
}

// load when page ready

function prevQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        showQuestion();
    }
}

async function submitQuiz() {
    try {
        const token = localStorage.getItem("token");
        const res = await fetch("/api/quiz/submit", {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ answers })
        });

        if (res.ok) {
            Swal.fire({
                icon: 'success',
                title: 'Quiz Submitted!',
                text: 'Your quiz was submitted successfully.',
                confirmButtonText: 'OK'
            }).then(() => {
                window.location.href = "index.html";
            });
        } else {
            Swal.fire({
                icon: 'error',
                title: 'Submission Failed',
                text: 'Error submitting quiz. Please try again.',
                confirmButtonText: 'OK'
            });
        }
    } catch (error) {
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'Something went wrong while submitting your quiz.',
            confirmButtonText: 'OK'
        });
    }
}

// Set time (in seconds) — 50 minutes = 3000 seconds
let timeLeft = 25 * 60;

function startTimer() {
    const timerDisplay = document.getElementById("timer");

    const timerInterval = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        // Add leading zero if needed
        seconds = seconds < 10 ? "0" + seconds : seconds;

        timerDisplay.textContent = `Time Left: ${minutes}:${seconds}`;

        // When timer runs out
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert("⏰ Time is up! Your quiz will be submitted.");
            submitQuiz(); // call your quiz submission function
        }

        timeLeft--;
    }, 1000);
}

// Call this when quiz starts
startTimer();





let cameraStream;
let cameraCheckInterval;
let cameraAlertShown = false; // Prevent repeated alerts

// Start camera when quiz begins
async function startCamera() {
    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        document.getElementById('liveCamera').srcObject = cameraStream;

        // Check every second if camera is still running
        cameraCheckInterval = setInterval(() => {
            if (!isCameraOn() && !cameraAlertShown) {
                cameraAlertShown = true; // Prevent multiple alerts
                clearInterval(cameraCheckInterval); // Stop checking
                Swal.fire({
                    icon: 'error',
                    title: 'Camera Feed Lost',
                    text: 'Your camera was turned off. The quiz will now be auto-submitted.',
                    confirmButtonText: 'OK'
                }).then(() => {
                    submitQuiz();
                });
            }
        }, 1000);

    } catch (error) {
        Swal.fire({
            icon: 'warning',
            title: 'Camera Access Required',
            text: 'You must allow camera access to take the quiz.',
            confirmButtonText: 'OK'
        }).then(() => {
            submitQuiz(); // Auto submit if no camera permission
        });
    }
}

// Check if camera is still on
function isCameraOn() {
    return cameraStream && cameraStream.getVideoTracks().some(track => track.readyState === "live");
}

// Stop camera after quiz ends
function stopCamera() {
    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
    }
    clearInterval(cameraCheckInterval);
}
