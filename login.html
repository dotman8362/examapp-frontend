<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - LAUTECH Software Institute Final Assessment</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4e54c8, #8f94fb);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }
        img.logo {
            width: 80px;
            height: auto;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 20px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 7px 0;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"], input[type="password"] {
            background: #fff;
            color: #333;
        }
        button {
            background: #fff;
            color: #4e54c8;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s ease;
        }
        button:hover {
            background: #f1f1f1;
        }
        .link {
            display: block;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #fff;
            text-decoration: underline;
        }
        /* Spinner styles */
        .spinner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            margin: -20px 0 0 -20px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            z-index: 10;
        }
        @keyframes spin {
            0% { transform: rotate(0deg);}
            100% { transform: rotate(360deg);}
        }
        .overlay {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Loading Overlay + Spinner -->
        <div class="overlay"></div>
        <div class="spinner"></div>

        <!-- Logo -->
        <img src="./LSEI LOGO.png" alt="LAUTECH Logo" class="logo">

        <h1>IT Student Login</h1>
        <form id="loginForm">
            <input type="text" id="username" name="username" placeholder="Enter Username" required>
            <input type="password" id="password" name="password" placeholder="Enter Password" required>
            <button type="submit">Login</button>
        </form>
        <a href="index.html" class="link">Back to Home</a>
    </div>

    <script>
        const spinner = document.querySelector(".spinner");
        const overlay = document.querySelector(".overlay");

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!username || !password) {
                Swal.fire("Missing Fields", "Please enter both username and password.", "warning");
                return;
            }

            // Show spinner
            spinner.style.display = "block";
            overlay.style.display = "block";

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                // Hide spinner
                spinner.style.display = "none";
                overlay.style.display = "none";

                if (res.ok) {
                    Swal.fire({
                        icon: "success",
                        title: "Login Successful!",
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        localStorage.setItem("token", data.token);
                        window.location.href = "testinstrustions.html";
                    });
                } else {
                    Swal.fire("Login Failed", data.message || "Invalid credentials.", "error");
                }
            } catch (error) {
                spinner.style.display = "none";
                overlay.style.display = "none";
                Swal.fire("Server Error", "Unable to connect to the server.", "error");
            }
        });
    </script>
</body>
</html>
