<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAUTECH Software Institute - Final Assessment</title>
<style>
    /* Global styles */
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #1f1c2c, #928DAB);
        background-size: 400% 400%;
        animation: gradientBG 12s ease infinite;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: 20px;
    }

    /* Gradient animation */
    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Main layout container */
    .main-wrapper {
        display: flex;
        align-items: center;
        gap: 40px;
        max-width: 1000px;
        width: 100%;
        flex-wrap: wrap;
        justify-content: center;
    }

    /* Container with glass effect */
    .container {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        color: #fff;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        animation: fadeIn 1.2s ease, float 4s ease-in-out infinite;
    }

    /* Side image */
    .side-image {
        max-width: 400px;
        width: 100%;
        border-radius: 15px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        animation: fadeIn 1.5s ease;
    }

    /* Fade-in animation */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Floating effect */
    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
    }

    /* Logo */
    img.logo {
        width: 120px;
        height: auto;
        margin-bottom: 15px;
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
    }

    /* Gradient title */
    h1 {
        font-size: 1.6rem;
        margin-bottom: 15px;
        line-height: 1.4;
        background: linear-gradient(to right, #fff, #c37e34);
        color: #C37E34;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* Subtitle */
    p {
        font-size: 1rem;
        margin-bottom: 15px;
    }

    /* Warning text */
    p.warning {
        color: red;
        font-size: 1.2rem;
    }

    /* Button group */
    .btn-group {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-top: 20px;
    }

    /* Buttons with glow effect */
    .btn {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        background: linear-gradient(to right, #ffffff, #dcdcdc);
        color: #4e54c8;
        transition: all 0.3s ease;
        box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .btn:hover {
        background: #C37E34;
        color: #000;
        box-shadow: 0 0 20px rgba(255,255,255,0.7);
        transform: scale(1.05);
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
        .main-wrapper {
            flex-direction: column;
            gap: 20px;
        }
    }
</style>
</head>
