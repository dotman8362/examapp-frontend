<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instructor Login - LSEI</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
     body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(120deg, #89f7fe, #66a6ff);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .login-container {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 35px 30px;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
        width: 350px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .logo {
        width: 120px;
        height: auto;
        margin-bottom: 15px;
    }

    h2 {
        margin-bottom: 20px;
        font-size: 1.5rem;
        color: #222;
    }

    input {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        outline: none;
        font-size: 1rem;
        background: rgba(255, 255, 255, 0.8);
        color: #333;
        transition: all 0.3s ease;
    }

    input:focus {
        border-color: #66a6ff;
        box-shadow: 0 0 8px rgba(102, 166, 255, 0.4);
    }

    button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: none;
        background: linear-gradient(120deg, #66a6ff, #89f7fe);
        color: white;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s ease;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(102, 166, 255, 0.4);
    }

    .error {
        background: rgba(255, 0, 0, 0.15);
        padding: 8px;
        border-radius: 8px;
        margin-top: 10px;
        display: none;
        color: #b00020;
        font-size: 0.9rem;
    }
    /* Spinner styling */
.spinner {
    display: none;
    width: 50px;
    height: 50px;
    border: 5px solid #ccc;
    border-top-color: #3498db;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 9999;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>
    <div class="login-container">
        <img src="./LSEI LOGO.png" width="200px" height="200px" alt="">
        <h2>Instructor Login</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="adminLogin()">Login</button>
        <div class="error" id="errorMsg"></div>
    </div>

<div id="spinner" class="spinner"></div>

<script>
async function adminLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const spinner = document.getElementById("spinner");

    if (!username || !password) {
        Swal.fire({
            icon: 'warning',
            title: 'Missing Information',
            text: 'Please fill in both username and password.'
        });
        return;
    }

    spinner.style.display = 'flex';

    try {
        const res = await fetch("https://examapp-backend-0b73.onrender.com/api/auth/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        spinner.style.display = 'none';

        if (!res.ok) {
            Swal.fire({
                icon: 'error',
                title: 'Login Failed',
                text: data.message || "Invalid username or password"
            });
            return;
        }

        Swal.fire({
            icon: 'success',
            title: 'Login Successful!',
            text: 'Redirecting to dashboard...',
            timer: 1500,
            showConfirmButton: false
        }).then(() => {
            localStorage.setItem("adminToken", data.token);
            window.location.href = "admindashboard.html";
        });

    } catch (error) {
        spinner.style.display = 'none';
        Swal.fire({
            icon: 'error',
            title: 'Server Error',
            text: 'Unable to connect to the server. Please try again later.'
        });
    }
}
</script>
</body>
</html>
